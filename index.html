<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotus Cybersecurity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --bg:#020917;
      --surface:#08132a;
      --surface-2:#0d1f3c;
      --cyan:#22d3ee;
      --pink:#ff90c8;
      --purple:#b06eff;
      --text:rgba(220,235,255,0.92);
      --muted:rgba(160,185,225,0.70);
      --border:rgba(34,211,238,0.16);
      --glow:0 0 30px rgba(34,211,238,0.15);
      --display:'Cinzel', serif;
      --body:'Nunito', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body{
      background:
        radial-gradient(circle at top right, rgba(34,211,238,0.10), transparent 30%),
        radial-gradient(circle at bottom left, rgba(176,110,255,0.10), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: var(--body);
      line-height: 1.65;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container{
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .section{
      padding: 90px 0;
      position: relative;
    }

    .section-divider::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:1px;
      background: linear-gradient(90deg, transparent, rgba(34,211,238,0.5), transparent);
    }

    .eyebrow{
      display:inline-block;
      color:var(--cyan);
      font-size:12px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:14px;
    }

    .title{
      font-family: var(--display);
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.1;
      margin-bottom: 16px;
      color: #fff;
    }

    .title .accent{
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .sub{
      color: var(--muted);
      font-size: 16px;
      max-width: 720px;
    }

    /* NAV */
    .nav{
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(16px);
      background: rgba(2,9,23,0.82);
      border-bottom: 1px solid var(--border);
      transition: .25s ease;
    }

    .nav-inner{
      min-height: 74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      font-family: var(--display);
      font-size: 20px;
      font-weight: 600;
      color:#fff;
      white-space: nowrap;
    }

    .brand span{ color: var(--cyan); }

    .nav-links{
      display:flex;
      gap:22px;
      list-style:none;
      flex-wrap:wrap;
      justify-content:center;
    }

    .nav-links a{
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
      transition:.2s ease;
    }

    .nav-links a:hover{ color: var(--cyan); }

    .nav-cta,
    .btn-primary,
    .btn-secondary{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      font-weight:800;
      letter-spacing:.04em;
      transition:.2s ease;
      cursor:pointer;
    }

    .nav-cta{
      padding:11px 18px;
      border:1px solid rgba(34,211,238,0.45);
      color:var(--cyan);
      font-size:12px;
      white-space:nowrap;
    }

    .nav-cta:hover{
      background: var(--cyan);
      color:#02111f;
      transform: translateY(-1px);
    }

    /* HERO */
    .hero{
      padding: 92px 0 70px;
      min-height: calc(100vh - 74px);
      display:flex;
      align-items:center;
    }

    .hero-grid{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 46px;
      align-items:center;
    }

    .hero-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 16px;
      border:1px solid rgba(34,211,238,0.26);
      border-radius:999px;
      background: rgba(34,211,238,0.08);
      color: var(--cyan);
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em
