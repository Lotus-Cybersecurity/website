<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotus Cybersecurity | Cybersecurity for Local Business</title>
  <meta name="description" content="Lotus Cybersecurity helps local businesses assess risk, secure systems, and stay protected with clear reporting, practical setup, and ongoing monitoring." />
  <style>
    :root {
      --bg: #030816;
      --bg-2: #071126;
      --panel: rgba(8, 18, 39, 0.72);
      --panel-2: rgba(12, 24, 50, 0.72);
      --line: rgba(120, 179, 255, 0.14);
      --text: #eef7ff;
      --muted: #9ab2cf;
      --soft: #6c7ea1;
      --cyan: #3be4ff;
      --cyan-2: #19b9ff;
      --blue: #3a68ff;
      --violet: #8b7dff;
      --green: #74ffb2;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      --radius: 28px;
      --radius-sm: 20px;
      --container: 1220px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(59, 228, 255, 0.10), transparent 24%),
        radial-gradient(circle at 80% 10%, rgba(58, 104, 255, 0.10), transparent 20%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .section {
      position: relative;
      padding: 110px 0;
    }

    .section-soft {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(59, 228, 255, 0.18);
      background: rgba(59, 228, 255, 0.08);
      color: #baf7ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 0 22px rgba(59, 228, 255, 0.08) inset;
    }

    .section-title {
      margin: 18px 0 14px;
      font-size: clamp(34px, 4vw, 54px);
      line-height: 1.02;
      letter-spacing: -1.8px;
    }

    .section-text {
      margin: 0;
      max-width: 760px;
      font-size: 18px;
      line-height: 1.85;
      color: var(--muted);
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 8, 22, 0.78);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(59, 228, 255, 0.08);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 14px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(59, 228, 255, 0.16), rgba(58, 104, 255, 0.12));
      border: 1px solid rgba(59, 228, 255, 0.22);
      color: #bdf7ff;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 0 28px rgba(59, 228, 255, 0.12);
    }

    .brand-title { font-size: 17px; font-weight: 800; }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-size: 14px;
      color: #d2dff1;
      transition: color 0.2s ease;
    }

    .nav-links a:hover { color: #baf7ff; }

    .button,
    .button-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 20px;
      border-radius: 16px;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .button:hover,
    .button-outline:hover { transform: translateY(-1px); }

    .button {
      border: none;
      color: #04121b;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-2));
      box-shadow: 0 14px 40px rgba(59, 228, 255, 0.2);
    }

    .button-outline {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 94px 0 120px;
    }

    #networkCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.9;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(59,228,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,228,255,0.04) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.15), transparent);
      pointer-events: none;
    }

    .hero-glow-a,
    .hero-glow-b,
    .hero-glow-c {
      position: absolute;
      border-radius: 999px;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .hero-glow-a {
      width: 420px; height: 420px; left: -60px; top: -30px;
      background: rgba(59, 228, 255, 0.12);
    }
    .hero-glow-b {
      width: 380px; height: 380px; right: 4%; top: 40px;
      background: rgba(58, 104, 255, 0.12);
    }
    .hero-glow-c {
      width: 420px; height: 420px; left: 48%; top: 52%;
      background: rgba(139, 125, 255, 0.08);
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.03fr 0.97fr;
      gap: 42px;
      align-items: center;
    }

    .hero-title {
      margin: 18px 0 18px;
      font-size: clamp(46px, 6vw, 78px);
      line-height: 0.96;
      letter-spacing: -2.4px;
      max-width: 820px;
      text-shadow: 0 0 18px rgba(59, 228, 255, 0.08);
    }

    .hero-copy {
      max-width: 660px;
      margin: 0;
      color: #d2deee;
      font-size: 19px;
      line-height: 1.85;
    }

    .hero-copy strong { color: #eaf8ff; }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 32px;
    }

    .hero-tags {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-tag {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: #d7e8ff;
      font-size: 13px;
      font-weight: 700;
    }

    .hero-mini {
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      max-width: 520px;
    }

    .mini-card,
    .glass-panel,
    .card,
    .metric-card,
    .pricing-card,
    .process-card,
    .industry-card,
    .quote-card,
    .blossom-panel,
    .fr-panel,
    .contact-card,
    .preview-window,
    .report-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .mini-card {
      padding: 16px;
      background: rgba(255,255,255,0.04);
    }

    .mini-num {
      color: #9df7ff;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .mini-label { color: #dfebff; font-size: 14px; }

    .glass-panel {
      position: relative;
      padding: 24px;
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03));
      overflow: hidden;
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(59,228,255,0.14), transparent 34%);
      pointer-events: none;
    }

    .snapshot {
      position: relative;
      z-index: 1;
      padding: 26px;
      border-radius: 26px;
      background: rgba(8, 18, 39, 0.9);
      border: 1px solid rgba(59,228,255,0.16);
    }

    .snapshot-head,
    .report-head,
    .preview-head,
    .pricing-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .small-label { font-size: 13px; color: var(--muted); }
    .snap-title,
    .report-title,
    .preview-title { margin-top: 4px; font-size: 22px; font-weight: 800; }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid rgba(116,255,178,0.22);
      background: rgba(116,255,178,0.10);
      color: #caffdf;
    }

    .pill-cyan {
      border-color: rgba(59,228,255,0.18);
      background: rgba(59,228,255,0.10);
      color: #cfffff;
    }

    .metric-card { padding: 16px; margin-bottom: 14px; background: rgba(255,255,255,0.04); }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .metric-row strong { color: #ebf5ff; }
    .cyan { color: #9df7ff; }
    .amber { color: #ffe393; }
    .violet { color: #d0c7ff; }
    .red { color: #ffb2b2; }

    .bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #263651;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--cyan-2));
    }

    .bar-1 span { width: 84%; }
    .bar-2 span { width: 42%; background: linear-gradient(90deg, #ffd86a, #ffb938); }
    .bar-3 span { width: 64%; background: linear-gradient(90deg, #b39cff, #8b7dff); }
    .bar-4 span { width: 34%; background: linear-gradient(90deg, #ff9b9b, #ff6767); }

    .hero-stats {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .stat-box {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stat-k {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .stat-v {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .cards-3,
    .cards-4,
    .cards-pricing,
    .cards-industries,
    .cards-quotes {
      display: grid;
      gap: 22px;
    }

    .cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cards-pricing { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards-industries { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards-quotes { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card,
    .process-card,
    .industry-card,
    .quote-card,
    .pricing-card,
    .fr-panel,
    .contact-card { padding: 28px; }

    .card,
    .process-card,
    .industry-card,
    .quote-card,
    .pricing-card {
      transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
    }

    .card:hover,
    .process-card:hover,
    .industry-card:hover,
    .quote-card:hover,
    .pricing-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59,228,255,0.28);
      box-shadow: 0 0 0 1px rgba(59,228,255,0.05), var(--shadow);
    }

    .card-top,
    .process-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .step-number {
      color: #9df7ff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.22em;
    }

    .icon-circle {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(59,228,255,0.10);
      color: #baf7ff;
      font-size: 23px;
      flex-shrink: 0;
      box-shadow: inset 0 0 18px rgba(59,228,255,0.06);
    }

    .card h3,
    .process-card h3,
    .industry-card h3,
    .quote-card h3,
    .pricing-card h3,
    .
