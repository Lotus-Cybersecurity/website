<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lotus Cybersecurity</title>

<link rel="stylesheet" href="style.css">

<style>

/* INTERACTIVE NETWORK GRAPHIC */

.network-demo{
margin-top:80px;
text-align:center;
}

.network-container{
position:relative;
margin:auto;
width:900px;
height:420px;
}

.node{
position:absolute;
width:120px;
height:120px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:600;
text-align:center;
padding:10px;
transition:all .35s ease;
cursor:pointer;
}

.vulnerable{
background:#2a0f13;
border:2px solid #ff3b3b;
color:#ff6a6a;
box-shadow:0 0 15px rgba(255,0,0,.3);
}

.secure{
background:#071b27;
border:2px solid #00e1ff;
color:#8ff5ff;
box-shadow:0 0 15px rgba(0,225,255,.35);
}

.connection{
position:absolute;
height:2px;
background:#ff3b3b;
transition:.35s;
}

.secure-line{
background:#00e1ff;
box-shadow:0 0 8px #00e1ff;
}

/* Node placement */

.router{top:160px;left:390px;}
.workstation{top:30px;left:120px;}
.email{top:30px;right:120px;}
.cloud{bottom:30px;left:120px;}
.camera{bottom:30px;right:120px;}

.connection1{top:115px;left:240px;width:180px;transform:rotate(20deg);}
.connection2{top:115px;right:240px;width:180px;transform:rotate(-20deg);}
.connection3{bottom:115px;left:240px;width:180px;transform:rotate(-20deg);}
.connection4{bottom:115px;right:240px;width:180px;transform:rotate(20deg);}

.network-title{
font-size:36px;
margin-bottom:10px;
}

.network-sub{
color:#aaa;
margin-bottom:40px;
}

</style>
</head>

<body>

<header>
<nav class="nav">
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="future-tech.html">Future Tech</a>
<a href="threat-center.html">Threat Center</a>
<a href="about.html">About</a>
<a href="contact.html">Book Assessment</a>
</nav>
</header>

<section class="network-demo">

<h2 class="network-title">From Vulnerable to Protected</h2>

<p class="network-sub">
Hover over the environment to see how Lotus transforms exposed systems into a secured network.
</p>

<div class="network-container" id="network">

<div class="node router vulnerable">Router<br>Weak Firewall</div>
<div class="node workstation vulnerable">Workstation<br>Unpatched</div>
<div class="node email vulnerable">Email<br>No MFA</div>
<div class="node cloud vulnerable">Cloud Apps<br>Exposed</div>
<div class="node camera vulnerable">IoT Devices<br>Unmanaged</div>

<div class="connection connection1"></div>
<div class="connection connection2"></div>
<div class="connection connection3"></div>
<div class="connection connection4"></div>

</div>

</section>

<script>

const network = document.getElementById("network")
const nodes = document.querySelectorAll(".node")
const lines = document.querySelectorAll(".connection")

network.addEventListener("mouseenter", () => {

nodes.forEach(n=>{
n.classList.remove("vulnerable")
n.classList.add("secure")
})

lines.forEach(l=>{
l.classList.add("secure-line")
})

nodes[0].innerHTML="Router<br>Hardened Firewall"
nodes[1].innerHTML="Workstation<br>Endpoint Protected"
nodes[2].innerHTML="Email<br>MFA Enabled"
nodes[3].innerHTML="Cloud Apps<br>Access Secured"
nodes[4].innerHTML="IoT Devices<br>Segmented Network"

})

network.addEventListener("mouseleave", () => {

nodes.forEach(n=>{
n.classList.remove("secure")
n.classList.add("vulnerable")
})

lines.forEach(l=>{
l.classList.remove("secure-line")
})

nodes[0].innerHTML="Router<br>Weak Firewall"
nodes[1].innerHTML="Workstation<br>Unpatched"
nodes[2].innerHTML="Email<br>No MFA"
nodes[3].innerHTML="Cloud Apps<br>Exposed"
nodes[4].innerHTML="IoT Devices<br>Unmanaged"

})

</script>

</body>
</html>
